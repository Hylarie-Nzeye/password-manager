<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h2 class="text-center">🔐 Password Manager</h2>

        <!-- Formulaire d'ajout -->
        <div class="card p-4 mt-3">
            <form method="POST" action="/add">
                <div class="input-group">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="text" name="site_url" class="form-control" placeholder="Website URL" required>
                </div>
                <div class="input-group password-container">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword(this)"></i>
                </div>
                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
            </form>
        </div>

        <!-- Table des mots de passe -->
        <div class="mt-4">
            <h4>🔑 Saved Passwords</h4>
            <table class="table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Website</th>
                        <th>Password</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in passwordList %}
                    <tr>
                        <td>{{ entry.email }}</td>
                        <td>{{ entry.site_url }}</td>
                        <td>
                            <div class="password-container">
                                <input type="password" class="form-control password-field" value="{{ entry.password }}" disabled>
                                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword(this)"></i>
                            </div>
                        </td>
                        <td>
                            <a href="/delete/{{ entry.id }}" class="btn btn-danger btn-sm">Delete</a>
                            <a href="/update/{{ entry.id }}" class="btn btn-warning btn-sm">Update</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Export Button at the bottom -->
        <div class="export-container text-center mt-4">
            <a href="/export" class="btn-sucess">Export</a>
        </div>
    </div>

    <script>
        function togglePassword(element) {
            let input = element.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                element.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                element.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>

</body>
</html>
